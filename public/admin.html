<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kerry Kott Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F0EB;
  --ink:#2A221E;
  --border:#C7BCAD;
  --muted:#8C8073;
  --panel:#FFFFFF;
  --accent:#a8463c;
  --ok:#3f6b4a;
  --font-display:"Playfair Display",Georgia,serif;
  --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
}
[hidden]{display:none !important;}

/* ---- login gate ---- */
#admin-login{
  max-width:380px;margin:14vh auto 0;padding:0 20px;text-align:center;
}
.kk-logo{display:block;width:220px;max-width:100%;height:auto;margin:0 auto 18px;}
.kk-logo-app{width:170px;margin:0 0 18px;}
#admin-login h1{font-family:var(--font-display);font-weight:600;font-size:28px;margin:0 0 6px;}
#admin-login p{color:var(--muted);font-size:14px;margin:0 0 24px;}
#admin-login input{
  width:100%;font-size:16px;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:10px;outline:none;margin-bottom:12px;background:var(--panel);
}
#admin-login input:focus{border-color:var(--ink);}
#admin-login button{
  width:100%;font-size:16px;font-weight:600;padding:12px 16px;border:none;
  border-radius:10px;background:var(--ink);color:var(--cream);cursor:pointer;
}
#admin-login button:hover{opacity:.92;}
#admin-login .login-error{color:var(--accent);font-size:14px;margin-top:12px;min-height:20px;}

/* ---- app shell ---- */
#admin-app{max-width:920px;margin:0 auto;padding:32px 20px 100px;}
.admin-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.admin-head h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;}
.admin-head .sub{color:var(--muted);font-size:13px;}
#home-link{font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;}
#home-link:hover{text-decoration:underline;}

.home-list{display:flex;flex-direction:column;gap:12px;}
.home-card{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:18px 22px;
}
.home-card h3{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 4px;}
.home-card-url{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.home-card-btn{
  font-size:14px;font-weight:600;padding:9px 20px;border-radius:999px;border:none;
  background:var(--ink);color:var(--cream);cursor:pointer;white-space:nowrap;
}
.home-card-btn:hover{opacity:.92;}

.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1.5px solid var(--border);}
.tab-btn{
  font-family:var(--font-body);font-size:15px;font-weight:600;color:var(--muted);
  background:none;border:none;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1.5px;
}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
.tab-btn:hover{color:var(--ink);}

.panel-loading{color:var(--muted);padding:30px 0;}
.panel-error{color:var(--accent);padding:16px;background:#fdf1ef;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;}

.rename-row{margin-bottom:14px;}
.rename-row .mini{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
.rename-inputs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rename-inputs input[type=text]{
  flex:1 1 260px;min-width:180px;font-size:16px;padding:9px 14px;
  border:1.5px solid var(--border);border-radius:8px;font-family:var(--font-display);
}
.rename-inputs button{
  font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;border:none;
  background:var(--ink);color:var(--cream);cursor:pointer;
}
.rename-inputs button:hover{opacity:.92;}
.toolbar-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.toolbar-btn{
  font-size:15px;font-weight:700;padding:14px 22px;border-radius:12px;cursor:pointer;
  border:2px solid var(--ink);background:var(--panel);color:var(--ink);
}
.toolbar-btn:hover{background:#F0EAE0;}
.toolbar-btn-primary{background:var(--ink);color:var(--cream);}
.toolbar-btn-primary:hover{opacity:.92;background:var(--ink);}

/* Style modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(42,34,30,.45);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow-y:auto;
}
.modal-card{
  background:var(--panel);border-radius:16px;max-width:520px;width:100%;
  padding:26px 28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h2{font-family:var(--font-display);font-size:22px;margin:0;}
.modal-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;}
.modal-x:hover{color:var(--ink);}
.style-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;}
.style-row label{font-size:14px;font-weight:600;}
.style-row input[type=color]{
  width:44px;height:34px;padding:0;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;background:none;
}
.style-row select{
  font-size:14px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;min-width:180px;
}
.style-transparent-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:-10px 0 18px;}
.style-transparent-row input[type=checkbox]{width:auto;}
.style-reset-btn{
  font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--border);background:none;color:var(--ink);
}
.style-reset-btn:hover{border-color:var(--ink);}

/* Delete-form modal */
.delete-warning{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 18px;}
#delete-modal .mini{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
#delete-confirm-name{color:var(--accent);text-transform:none;font-size:14px;}
#delete-confirm-input{
  width:100%;font-size:16px;padding:11px 14px;border:1.5px solid var(--border);
  border-radius:8px;outline:none;margin-bottom:16px;font-family:var(--font-body);
}
.delete-confirm-btn{
  font-size:15px;font-weight:600;padding:11px 26px;border:none;border-radius:999px;
  background:var(--accent);color:#fff;cursor:pointer;
}
.delete-confirm-btn:hover{opacity:.92;}
.delete-confirm-btn:disabled{opacity:.4;cursor:not-allowed;}

.danger-zone{
  border:1.5px dashed #e8c9c2;border-radius:14px;padding:16px 18px;margin-top:24px;
}
.danger-zone-btn{
  font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--accent);background:none;color:var(--accent);
}
.danger-zone-btn:hover{background:#fdf1ef;}

.home-card-delete{
  font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;
  padding:4px 6px;margin-top:6px;text-decoration:underline;
}
.home-card-delete:hover{color:var(--accent);}

.mentee-meta{font-size:13px;color:var(--muted);margin:2px 0 6px;}
.mentee-meta strong{color:var(--ink);}
.mentee-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mentee-adjust-msg{font-size:12px;color:var(--muted);width:100%;text-align:right;}
.mentee-adjust-msg.err{color:var(--accent);}
.mentee-warning{font-size:12.5px;color:var(--accent);background:#fdf1ef;border-radius:6px;padding:4px 8px;margin:0 0 6px;display:inline-block;}
.mentee-sessions-toggle{
  font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;
  padding:0;margin-top:6px;text-decoration:underline;display:block;
}
.mentee-sessions-toggle:hover{color:var(--ink);}
.mentee-sessions{list-style:none;margin:6px 0 0;padding:8px 12px;background:#FBF9F6;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.mentee-sessions li{padding:2px 0;}
.mentee-sessions-empty{font-size:13px;color:var(--muted);margin:6px 0 0;font-style:italic;}

.add-form-btn{
  font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;
  border:1.5px dashed var(--border);background:none;color:var(--ink);cursor:pointer;margin-top:4px;
}
.add-form-btn:hover{border-color:var(--ink);}
.add-form-box{
  background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
  padding:18px 22px;margin-top:14px;max-width:480px;
}
.add-form-box select{
  width:100%;font-size:15px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;
}
.add-form-hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5;}

.embed-box{
  background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:20px;
}
.embed-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.embed-code{
  flex:1 1 260px;min-width:200px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#FBF9F6;border:1px solid var(--border);border-radius:8px;padding:9px 12px;
  overflow-x:auto;white-space:nowrap;color:var(--muted);
}
.copy-embed-btn{
  font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  border:none;background:var(--ink);color:var(--cream);
}
.copy-embed-btn:hover{opacity:.92;}
.copy-msg{font-size:13px;color:var(--ok);}
/* Live side-by-side editor: left = fields, right = a real render of the
   form (via iframe.srcdoc), rebuilt from the in-memory config on every
   edit - no Save needed to see it. */
#admin-app.is-editing-form{max-width:1440px;}
.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,1fr);gap:28px;align-items:start;}
.edit-col{min-width:0;}
.preview-col{position:sticky;top:20px;min-width:0;}
.preview-live-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.preview-live-head h2{font-family:var(--font-display);font-size:16px;margin:0;color:var(--muted);font-weight:600;}
.preview-toggle{display:flex;gap:2px;background:var(--panel);border:1.5px solid var(--border);border-radius:999px;padding:2px;}
.preview-toggle-btn{
  font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;border:none;
  background:none;color:var(--muted);cursor:pointer;
}
.preview-toggle-btn.active{background:var(--ink);color:var(--cream);}
.preview-live-wrap{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;position:relative;}
.preview-live-frame{display:block;width:100%;height:calc(100vh - 140px);min-height:480px;border:none;background:#fff;}
.preview-live-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13.5px;background:#fff;}
@media (max-width:980px){
  #admin-app.is-editing-form{max-width:920px;}
  .editor-grid{grid-template-columns:minmax(0,1fr);}
  .preview-col{position:static;}
  .preview-live-frame{height:640px;}
}

.stage-card{
  background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
  padding:20px 22px;margin-bottom:20px;
}
.stage-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 14px;}
.confirm-card{
  background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
  padding:20px 22px;margin-bottom:20px;
}
.confirm-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 14px;}
.stage-row{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.stage-row label{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);}
.stage-row input[type=text]{
  font-size:15px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.stage-row textarea{
  font-size:15px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-family:var(--font-body);resize:vertical;line-height:1.5;
}
.tag-warning{font-size:12.5px;color:var(--accent);margin:2px 0 14px;}
.stage-note{font-size:13.5px;font-style:italic;color:var(--muted);margin:0 0 18px;}

.exit-note{
  font-size:12.5px;color:var(--accent);margin-top:10px;padding-top:10px;
  border-top:1px dashed #e8c9c2;line-height:1.7;
}
.exit-note .mini{display:block;color:var(--accent);text-transform:uppercase;letter-spacing:.02em;font-weight:600;margin:8px 0 4px;}
.exit-note .exit-tag-input{
  font-size:12.5px;padding:4px 8px;border:1.5px solid #e8c9c2;border-radius:6px;
  color:var(--accent);background:#fdf1ef;width:auto;min-width:100px;max-width:220px;
}
.exit-note .exit-msg-input{
  font-size:12.5px;padding:6px 10px;border:1.5px solid #e8c9c2;border-radius:8px;
  color:var(--accent);background:#fdf1ef;width:100%;font-family:var(--font-body);
  resize:vertical;line-height:1.5;
}

.field-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.field-row{
  border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#FBF9F6;
}
.field-row-top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
.field-row-top .grow{flex:1 1 220px;min-width:180px;}
.field-row label.mini{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px;}
.field-row input[type=text], .field-row select{
  width:100%;font-size:14px;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;
  background:#fff;font-family:var(--font-body);
}
.field-row input[type=text]{overflow:hidden;text-overflow:ellipsis;}
.field-row input[type=text]:focus{text-overflow:clip;}
.field-row input:disabled, .field-row select:disabled{background:#EEE9E2;color:var(--muted);cursor:not-allowed;}
.req-toggle{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;padding-top:20px;}
.field-btns{display:flex;gap:4px;padding-top:19px;}
.icon-btn{
  border:1.5px solid var(--border);background:#fff;border-radius:7px;width:30px;height:30px;
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{border-color:var(--ink);}
.icon-btn:disabled{opacity:.35;cursor:not-allowed;}
.icon-btn.danger:hover{border-color:var(--accent);color:var(--accent);}

.ghl-map{font-size:12px;color:var(--muted);margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.ghl-map.will-create{color:var(--ok);}
.locked-note{font-size:11px;color:var(--muted);margin-left:6px;}

.options-editor{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.options-editor .opt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.options-editor .opt-row input[type=text]{flex:1 1 140px;min-width:110px;}
.options-editor .opt-soldout{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;}
.add-option-btn, .add-field-btn{
  font-size:13px;font-weight:600;padding:7px 14px;border:1.5px dashed var(--border);
  border-radius:8px;background:none;cursor:pointer;color:var(--ink);
}
.add-option-btn:hover, .add-field-btn:hover{border-color:var(--ink);}

.save-row{display:flex;align-items:center;gap:14px;margin-top:6px;}
.save-btn{
  font-size:15px;font-weight:600;padding:11px 26px;border:none;border-radius:999px;
  background:var(--ink);color:var(--cream);cursor:pointer;
}
.save-btn:hover{opacity:.92;}
.save-btn:disabled{opacity:.5;cursor:default;}
.save-msg{font-size:14px;}
.save-msg.ok{color:var(--ok);}
.save-msg.err{color:var(--accent);white-space:pre-wrap;}

.admin-footer{
  position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1.5px solid var(--border);padding:12px 20px;text-align:center;font-size:13.5px;
}
.admin-footer a{color:var(--ink);font-weight:600;}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div id="admin-login">
  <img class="kk-logo" src="https://assets.cdn.filesafe.space/ps7itsG5PeLgg7TDwnGV/media/6a47eac4989afcfcc93100ed.png" alt="Kerry Kott">
  <h1>🌿 Admin</h1>
  <p>Enter the admin password to edit form fields, tags, and copy.</p>
  <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password">
  <button type="button" id="login-btn">Log In</button>
  <p class="login-error" id="login-error"></p>
  <button type="button" id="forgot-link" class="home-card-delete" style="margin-top:14px;">Forgot password?</button>
  <p class="login-error" id="forgot-msg" style="color:var(--ok);"></p>
</div>

<!-- ============ RESET PASSWORD (shown when the page loads with ?reset=<token>) ============ -->
<div id="admin-reset" hidden>
  <img class="kk-logo" src="https://assets.cdn.filesafe.space/ps7itsG5PeLgg7TDwnGV/media/6a47eac4989afcfcc93100ed.png" alt="Kerry Kott">
  <h1>🌿 Set a new password</h1>
  <p>Choose a new admin password — at least 6 characters.</p>
  <input type="password" id="reset-pw" placeholder="New password" autocomplete="new-password">
  <button type="button" id="reset-btn">Set Password &amp; Log In</button>
  <p class="login-error" id="reset-error"></p>
</div>

<!-- ============ MAIN APP (shown after login) ============ -->
<div id="admin-app" hidden>
  <img class="kk-logo kk-logo-app" src="https://assets.cdn.filesafe.space/ps7itsG5PeLgg7TDwnGV/media/6a47eac4989afcfcc93100ed.png" alt="Kerry Kott">
  <div class="admin-head">
    <h1><button type="button" id="home-link">🌿 Admin</button></h1>
    <div class="sub" id="admin-sub">Edit field labels, options, tags &amp; evergreen copy — no code push needed.</div>
    <button type="button" id="logout-link" class="home-card-delete" style="margin:0;">Log out</button>
  </div>

  <div class="tabs" id="section-tabs">
    <button type="button" class="tab-btn active" data-section="forms">Forms</button>
    <button type="button" class="tab-btn" data-section="calendars">Calendars</button>
    <button type="button" class="tab-btn" data-section="mentorship">Mentorship</button>
  </div>

  <div class="tabs" id="tabs" hidden></div>
  <div id="panel"></div>
</div>

<div class="admin-footer">
  Need something else changed? <a href="https://ticket.yourvbm.com" target="_blank" rel="noopener">Submit a request →</a>
</div>

<!-- ============ STYLE MODAL (opened via the 🎨 Style button) ============ -->
<div id="style-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Style</h2>
      <button type="button" id="style-close" class="modal-x" aria-label="Close">✕</button>
    </div>
    <div id="style-body"></div>
    <div class="save-row">
      <button type="button" class="save-btn" id="style-save">Save Style</button>
      <button type="button" class="style-reset-btn" id="style-reset">Reset to default</button>
      <span class="save-msg" id="style-msg"></span>
    </div>
  </div>
</div>

<!-- ============ DELETE MODAL (shared by forms & calendars) ============ -->
<div id="delete-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="delete-title">⚠️ Delete this form?</h2>
      <button type="button" id="delete-close" class="modal-x" aria-label="Close">✕</button>
    </div>
    <p class="delete-warning" id="delete-warning"></p>
    <label class="mini">Type <span id="delete-confirm-label-text">the form's</span> name to confirm: <strong id="delete-confirm-name"></strong></label>
    <input type="text" id="delete-confirm-input" autocomplete="off">
    <div class="save-row">
      <button type="button" class="delete-confirm-btn" id="delete-confirm-btn" disabled>Delete Forever</button>
      <span class="save-msg" id="delete-msg"></span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var WORKER_BASE = "https://kerry-forms.miriam-68c.workers.dev";
  var SITE_ORIGIN = "https://admin.kerrykott.com";
  var CAL_ORIGIN = "https://schedule.kerrykott.com";
  var FORMS = []; // loaded from /admin/registry after login
  var CALENDARS = null; // loaded from /admin/calendars after login (null = not yet loaded)

  function presetKeyForTheme(theme){
    var keys = Object.keys(FONT_PRESETS);
    for(var i=0;i<keys.length;i++){
      if(FONT_PRESETS[keys[i]].fontBody === theme.fontBody) return keys[i];
    }

  // Renders a color swatch plus a "Transparent" checkbox that disables it.
  // `value` may be a hex color or the literal string "transparent".
  function colorRowHtml(label, id, value, fallback){
    var isTransparent = value === "transparent";
    return '<div class="style-row"><label>'+esc(label)+'</label>'
      + '<input type="color" id="'+id+'" value="'+esc(isTransparent?fallback:value)+'"'+(isTransparent?' disabled':'')+'></div>'
      + '<label class="style-transparent-row"><input type="checkbox" id="'+id+'-transparent"'+(isTransparent?' checked':'')+'> Transparent</label>';
  }
  // Wires the checkbox to enable/disable its swatch, and returns a getter
  // for the resolved value ("transparent" or the swatch's hex) to read at save time.
  function wireColorRow(id){
    var colorEl = document.getElementById(id);
    var checkEl = document.getElementById(id+"-transparent");
    if(!colorEl || !checkEl) return null;
    checkEl.addEventListener("change", function(){ colorEl.disabled = checkEl.checked; });
    return function(){ return checkEl.checked ? "transparent" : colorEl.value; };
  }

          return '<option value="'+k+'"'+(k===presetKeyForTheme(theme)?' selected':'')+'>'+esc(FONT_PRESETS[k].label)+'</option>';

  /* ---------------- DELETE CALENDAR ---------------- */
  function openDeleteCalendarModal(calKey, label){
    document.getElementById("delete-title").textContent = "⚠️ Delete this calendar?";
    document.getElementById("delete-confirm-label-text").textContent = "the calendar's";
    document.getElementById("delete-warning").textContent =
      'This permanently deletes "'+label+'" and its page. ' +
      calendarUrl(calendarEntryByKey(calKey)) + ' will 404 immediately. ' +
      'This cannot be undone.';
    document.getElementById("delete-confirm-name").textContent = label;
    var input = document.getElementById("delete-confirm-input");
    var btn = document.getElementById("delete-confirm-btn");
    input.value = "";
    btn.disabled = true;
    document.getElementById("delete-msg").textContent = "";
    document.getElementById("delete-modal").hidden = false;

    input.oninput = function(){ btn.disabled = (input.value !== label); };

    btn.onclick = function(){
      var msgEl = document.getElementById("delete-msg");
      var cal = calendarEntryByKey(calKey);
      var next = CALENDARS.filter(function(c){ return calendarKey(c) !== calKey; });

      // Never-saved calendar: nothing on the server to delete yet.

        document.getElementById("delete-modal").hidden = true;

      .then(function(r){ return r.json().then(function(body){ return {ok:r.ok, body:body}; }); })
      .then(function(res){
        if(!res.ok){ btn.disabled = false; msgEl.textContent = res.body.error || "Couldn't delete. Try again."; return; }
        document.getElementById("delete-modal").hidden = true;

  /* ---------------- LIVE PREVIEW ----------------
     Renders the actual form template with the currently-edited (possibly
     unsaved) config, via iframe.srcdoc - no separate "Preview" button, no
     Save needed first. The template's own JS reads window.__EF_PREVIEW_CFG__
     (spliced in below) instead of fetching from the network when present. */
  var previewShowSuccess = false; // toggled by the Form/Confirmation buttons above the preview
  function buildPreviewSrcdoc(cfg, rawHtml){
    var json = JSON.stringify(cfg).replace(/<\/script/gi, "<\\/script");
    var out = rawHtml.replace("<head>", "<head>\n<script>window.__EF_PREVIEW_CFG__=" + json + ";<\/script>");
    if(previewShowSuccess){
      // Runs after the page's own script has built and shown the form, so
      // it just swaps which screen is visible - no template changes needed.
      var jump = '<script>'
        + '(function(){var f=document.getElementById("ef-form");if(f)f.hidden=true;'
        + 'var p=document.querySelector(".ef-progress");if(p)p.hidden=true;'
        + 'var s=document.getElementById("ef-success");if(s)s.hidden=false;})();'
        + '<\/script>';
      out = out.replace("</body>", jump + "</body>");
    }
    return out;
  }
  function refreshPreview(key, cfg, forceReload){
    var frame = document.getElementById("preview-live-frame");
    if(!frame || key !== state.activeForm) return;
    var loadingEl2 = document.getElementById("preview-live-loading");
    if(previewHtml[key]){
      if(loadingEl2) loadingEl2.hidden = true;
      frame.srcdoc = buildPreviewSrcdoc(cfg, previewHtml[key]);
      return;
    }
    if(!forceReload) return; // already fetching from an earlier call
    var entry = entryFor(key);
    if(!entry) return;
    fetch(embedUrl(entry))
      .then(function(r){ if(!r.ok) throw new Error("preview fetch failed"); return r.text(); })
      .then(function(rawHtml){
        previewHtml[key] = rawHtml;
        refreshPreview(key, state.configs[key]);
      })
      .catch(function(){
        if(loadingEl2) loadingEl2.textContent = "Couldn't load the preview.";
      });
  }
  function schedulePreviewRefresh(){
    var key = state.activeForm;
    var cfg = state.configs[key];
    if(!cfg) return;
    clearTimeout(previewDebounceTimer);
    previewDebounceTimer = setTimeout(function(){ refreshPreview(key, cfg); }, 400);
  }
  // Delegated, registered once: covers every current and future edit field
  // without wiring each one individually. Structural changes (add/delete
  // field, reorder, etc.) go through renderPanel(), which rebuilds the
  // preview iframe fresh on its own.
  panelEl.addEventListener("input", schedulePreviewRefresh);
  panelEl.addEventListener("change", schedulePreviewRefresh);

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function fallbackCopy(text, onDone){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      onDone();
    }catch(e){ /* nothing more we can do */ }
  }

  function authHeaders(){
    return {"Authorization": "Bearer " + pw, "Content-Type": "application/json"};

  /* ---------------- LOGIN ---------------- */
  loginBtn.addEventListener("click", doLogin);
  loginPw.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  function doLogin(){
    var candidate = loginPw.value;
    if(!candidate){ return; }
    loginErr.textContent = "";
    loginBtn.disabled = true; loginBtn.textContent = "Checking...";
    fetch(WORKER_BASE + "/admin/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({password: candidate})
    })
    .then(function(r){ return r.json().then(function(body){ return {ok: r.ok, body: body}; }); })
    .then(function(res){
      loginBtn.disabled = false; loginBtn.textContent = "Log In";
      if(!res.ok){ loginErr.textContent = "Wrong password. Please try again."; return; }
      pw = candidate;
      try{ sessionStorage.setItem("kk_admin_pw", pw); }catch(e){}
      showApp();
    })
    .catch(function(){
      loginBtn.disabled = false; loginBtn.textContent = "Log In";
      loginErr.textContent = "Couldn't reach the server. Please try again.";
    });
  }

  /* ---------------- FORGOT / RESET PASSWORD ---------------- */
  var forgotLink = document.getElementById("forgot-link");

  forgotLink.addEventListener("click", function(){

      .then(function(res){
        forgotLink.disabled = false;
        forgotMsg.textContent = res.ok
          ? "Check " + res.body.email + " for a reset link."
          : (res.body.error || "Couldn't send the email.");

  var resetEl = document.getElementById("admin-reset");
  var resetPw = document.getElementById("reset-pw");
  var resetBtn = document.getElementById("reset-btn");
  var resetErr = document.getElementById("reset-error");

  if(resetToken){

    var candidate = resetPw.value;
    if(!candidate){ return; }
    resetErr.textContent = "";
    resetBtn.disabled = true; resetBtn.textContent = "Saving...";
    fetch(WORKER_BASE + "/admin/reset-password", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({token: resetToken, password: candidate})
    })
    .then(function(r){ return r.json().then(function(body){ return {ok:r.ok, body:body}; }); })
    .then(function(res){
      resetBtn.disabled = false; resetBtn.textContent = "Set Password & Log In";
      if(!res.ok){ resetErr.textContent = res.body.error || "Couldn't reset the password."; return; }
      pw = candidate;
      try{ sessionStorage.setItem("kk_admin_pw", pw); }catch(e){}

      history.replaceState(null, "", location.pathname);
      resetEl.hidden = true;

      resetBtn.disabled = false; resetBtn.textContent = "Set Password & Log In";
      resetErr.textContent = "Couldn't reach the server. Please try again.";

  // Clears the stored session and shows the login screen again — used both

  function logOut(message){

  function showApp(){

      tabsEl.hidden = true;

        panelEl.innerHTML = '<p class="panel-loading">Loading calendars...</p>';
        loadCalendars()
          .then(render)

            if(err.message === "__unauthorized__"){ logOut("Your session expired. Please log in again."); return; }
            panelEl.innerHTML = '<p class="panel-error">Couldn\'t load the calendar list. Please refresh.</p>';
          });
        return;
      }
      if(state.activeCalendar === null){ renderCalendarsHome(); }
      else { renderCalendarPanel(); }
      return;

          .then(render)

  /* ---------------- DATA LOADING ---------------- */
  function loadForm(key){
    previewShowSuccess = false; // always land on the form view, not wherever the last form left off
    if(state.configs[key]){ renderPanel(); return; }
    state.loading[key] = true;
    renderPanel();
    fetch(WORKER_BASE + "/admin/config?form=" + key, {headers: authHeaders()})
      .then(function(r){
        if(r.status === 401){ throw new Error("__unauthorized__"); }
        if(!r.ok) throw new Error("Failed to load " + key + " config (HTTP " + r.status + ")");
        return r.json();
      })
      .then(function(cfg){
        state.loading[key] = false;
        state.configs[key] = cfg;
        renderPanel();
      })
      .catch(function(err){
        state.loading[key] = false;
        if(err.message === "__unauthorized__"){
          try{ sessionStorage.removeItem("kk_admin_pw"); }catch(e){}
          pw = null;
          appEl.hidden = true;
          loginEl.hidden = false;
          loginErr.textContent = "Your session expired. Please log in again.";
          return;
        }
        state.configs[key] = {__error: err.message};
        renderPanel();
      });
  }

        loadForm(state.activeForm);

  /* ---------------- PANEL ---------------- */
  function renderPanel(){
    var key = state.activeForm;
    if(state.loading[key]){
      panelEl.innerHTML = '<p class="panel-loading">Loading '+esc(key)+' config...</p>';
      return;
    }
    var cfg = state.configs[key];
    if(!cfg){ panelEl.innerHTML = ""; return; }
    if(cfg.__error){
      panelEl.innerHTML = '<p class="panel-error">Couldn\'t load this form: '+esc(cfg.__error)+'</p>';
      return;
    }

    var html = "";
    var entry = entryFor(key);
    if(entry){
      var url = embedUrl(entry);

      html += '<div class="toolbar-row">'
        + '<button type="button" class="toolbar-btn toolbar-btn-primary" id="style-open">🎨&nbsp; Style (colors &amp; fonts)</button>'
        + '</div>';

      html += '<div class="rename-row">'
        + '<label class="mini">Form name (internal — shown here and on the home screen only, never on the live form)</label>'
        + '<div class="rename-inputs"><input type="text" id="rename-input" value="'+esc(entry.label)+'">'
        + '<button type="button" id="rename-save">Save name</button>'
        + '<span class="copy-msg" id="rename-msg"></span>'
        + '</div>'
        + '</div>';

      // The listener resizes the iframe to the page's real content height
      // (reported via postMessage; see the "ef-resize" script in each form
      // page), so there's no dead space below a short form or clipping on a
      // tall one. min-height is just the size before that first message
      // arrives. Re-copy and re-paste this whole snippet anywhere it's
      // already embedded to pick up auto-sizing.
      var iframeId = "ef-iframe-" + key;
      var embedCode = '<iframe id="'+iframeId+'" src="'+url+'" style="width:100%;border:none;min-height:'+(entry.minHeight||700)+'px;display:block;"></iframe>'
        + '<script>(function(){var f=document.getElementById("'+iframeId+'");if(!f)return;'
        + 'window.addEventListener("message",function(e){'
        + 'if(e.source===f.contentWindow&&e.data&&e.data.type==="ef-resize"&&typeof e.data.height==="number"){'
        // min-height is only a fallback for before the first real
        // measurement arrives — once one does, clear it, or it permanently
        // floors the iframe and leaves dead space under shorter content.
        + 'f.style.minHeight="0";f.style.height=e.data.height+"px";}});})();<\/script>';
      html += '<div class="embed-box">'
        + '<div class="embed-row">'
        + '<code class="embed-code">'+esc(embedCode)+'</code>'
        + '<button type="button" class="copy-embed-btn" data-embed="'+esc(embedCode)+'">Copy iframe embed</button>'
        + '<span class="copy-msg" id="copy-msg-'+key+'"></span>'
        + '</div>'
        + '</div>';
    }
    cfg.stages.forEach(function(stage, sIdx){
      html += renderStage(key, cfg, stage, sIdx);
    });

    cfg.success = cfg.success || { heading: "", message: "" };
    html += '<div class="confirm-card">'
      + '<h2>Confirmation Message</h2>'
      + '<p class="stage-note">What people see on the page right after they submit — keep it short, a one-line heading plus a sentence works best.</p>'
      + '<div class="stage-row"><label>Emoji (optional)</label>'
      + '<input type="text" id="success-emoji-input" placeholder="e.g. ✨ or 🌿 — leave blank for none" value="'+esc(cfg.success.emoji||"")+'"></div>'
      + '<div class="stage-row"><label>Heading</label>'
      + '<input type="text" id="success-heading-input" value="'+esc(cfg.success.heading)+'"></div>'
      + '<div class="stage-row"><label>Message</label>'
      + '<textarea id="success-message-input" rows="2">'+esc(cfg.success.message)+'</textarea></div>'
      + '</div>';

    html += '<div class="save-row">'
      + '<button type="button" class="save-btn" id="save-btn-'+key+'">Save Changes</button>'
      + '<span class="save-msg" id="save-msg-'+key+'"></span>'
      + '</div>';

    if(entry){
      html += '<div class="danger-zone">'
        + '<button type="button" class="danger-zone-btn" id="danger-delete-form" data-form="'+key+'" data-label="'+esc(entry.label)+'">Delete this form</button>'
        + '</div>';
    }

    if(entry){
      appEl.classList.add("is-editing-form");
      panelEl.innerHTML = '<div class="editor-grid">'
        + '<div class="edit-col">' + html + '</div>'
        + '<div class="preview-col">'
        + '<div class="preview-live-head"><h2>Live preview</h2>'
        + '<div class="preview-toggle">'
        + '<button type="button" class="preview-toggle-btn'+(previewShowSuccess?'':' active')+'" id="preview-show-form">Form</button>'
        + '<button type="button" class="preview-toggle-btn'+(previewShowSuccess?' active':'')+'" id="preview-show-success">Confirmation</button>'
        + '</div>'
        + '</div>'
        + '<div class="preview-live-wrap">'
        + '<iframe class="preview-live-frame" id="preview-live-frame" title="Live form preview"></iframe>'
        + '<div class="preview-live-loading" id="preview-live-loading">Loading preview…</div>'
        + '</div>'
        + '</div>'
        + '</div>';
    } else {
      appEl.classList.remove("is-editing-form");
      panelEl.innerHTML = html;
    }

    wirePanelEvents(key, cfg);
    if(entry){
      refreshPreview(key, cfg, true);
      var showFormBtn = document.getElementById("preview-show-form");
      var showSuccessBtn = document.getElementById("preview-show-success");
      if(showFormBtn){
        showFormBtn.addEventListener("click", function(){
          if(!previewShowSuccess) return;
          previewShowSuccess = false;
          showFormBtn.classList.add("active");
          showSuccessBtn.classList.remove("active");
          refreshPreview(key, cfg);
        });
      }
      if(showSuccessBtn){
        showSuccessBtn.addEventListener("click", function(){
          if(previewShowSuccess) return;
          previewShowSuccess = true;
          showSuccessBtn.classList.add("active");
          showFormBtn.classList.remove("active");
          refreshPreview(key, cfg);
        });
      }
    }

    var styleOpenBtn = document.getElementById("style-open");
    if(styleOpenBtn){
      styleOpenBtn.addEventListener("click", function(){ openStyleModal(key, cfg); });
    }

    var dangerDeleteBtn = document.getElementById("danger-delete-form");
    if(dangerDeleteBtn){
      dangerDeleteBtn.addEventListener("click", function(){
        openDeleteModal(dangerDeleteBtn.getAttribute("data-form"), dangerDeleteBtn.getAttribute("data-label"));
      });
    }

    var renameSaveBtn = document.getElementById("rename-save");
    if(renameSaveBtn){
      renameSaveBtn.addEventListener("click", function(){
        var newLabel = document.getElementById("rename-input").value.trim();
        var msgEl = document.getElementById("rename-msg");
        if(!newLabel){ msgEl.textContent = "Name can't be empty."; msgEl.className = "save-msg err"; return; }
        renameSaveBtn.disabled = true; msgEl.textContent = "Saving...";
        var updated = FORMS.map(function(f){ return f.key===key ? Object.assign({}, f, {label:newLabel}) : f; });
        fetch(WORKER_BASE + "/admin/registry", {
          method: "POST", headers: authHeaders(), body: JSON.stringify(updated)
        })
        .then(function(r){ if(!r.ok) throw new Error("save failed"); return r.json(); })
        .then(function(reg){
          FORMS = reg;
          renameSaveBtn.disabled = false;
          msgEl.textContent = "Saved!"; msgEl.className = "save-msg ok";
          renderTabs();
          setTimeout(function(){ if(msgEl) msgEl.textContent = ""; }, 2000);
        })
        .catch(function(){ renameSaveBtn.disabled = false; msgEl.textContent = "Couldn't save."; msgEl.className = "save-msg err"; });
      });
    }

    var msg = state.saveMsg[key];
    if(msg){
      var el = document.getElementById("save-msg-"+key);
      el.textContent = msg.text;
      el.className = "save-msg " + (msg.ok ? "ok" : "err");
    }
  }

  function tagsToText(t){ return Array.isArray(t) ? t.join(", ") : (t || ""); }
  function textToTags(s){
    var parts = String(s||"").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
    if(parts.length <= 1) return parts[0] || "";
    return parts;
  }

  function renderStage(formKey, cfg, stage, sIdx){
    var html = '<div class="stage-card" data-stage-idx="'+sIdx+'">';
    html += '<h2>Stage: '+esc(stage.id)+'</h2>';
    html += '<div class="stage-row"><label>GHL Tag'+(Array.isArray(stage.tag)?' (comma-separated — more than one tag applies)':'')+'</label>'
      + '<input type="text" class="tag-input" data-stage-idx="'+sIdx+'" value="'+esc(tagsToText(stage.tag))+'"></div>';
    html += '<p class="tag-warning">Must exactly match what a GHL workflow trigger is watching for — a typo silently breaks the automation without breaking the form.</p>';
    if(stage.exit){
      var exitField = stage.fields.filter(function(f){ return f.id === stage.exit.field; })[0];
      var exitFieldLabel = exitField ? exitField.label : stage.exit.field;
      html += '<p class="stage-note">Also applies <strong>'+esc(tagsToText(stage.exit.tag))+'</strong> in addition to the tag above, when &ldquo;'+esc(exitFieldLabel)+'&rdquo; is answered &ldquo;'+esc(stage.exit.equals)+'&rdquo; — edit that under the question below.</p>';
    }
    if(stage.note){
      html += '<p class="stage-note">'+esc(stage.note)+'</p>';
    }
    html += '<div class="field-list">';
    stage.fields.forEach(function(field, fIdx){
      html += renderField(formKey, stage, field, sIdx, fIdx);
    });
    html += '</div>';
    var pickerKey = formKey + ":" + sIdx;
    var picker = existingFieldPicker[pickerKey];
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap;">'
      + '<button type="button" class="add-field-btn" data-add-field-stage="'+sIdx+'">+ Add field</button>'
      + '<button type="button" class="add-field-btn" data-existing-field-stage="'+sIdx+'">'
        + (picker && picker.open ? "Cancel" : "+ Choose existing field") + '</button>'
      + '</div>';
    if(picker && picker.open){ html += renderExistingFieldPicker(cfg, pickerKey); }
    if(formKey !== "application"){
      // Placed last, matching where the button actually sits on the live
      // form: after every field.
      var btnText = stage.buttonText || defaultButtonText(formKey);
      var btnAlign = stage.buttonAlign || defaultButtonAlign(formKey);
      html += '<div class="stage-row" style="margin-top:18px;"><label>Button text</label>'
        + '<input type="text" class="btn-text-input" data-stage-idx="'+sIdx+'" value="'+esc(btnText)+'"></div>';
      html += '<div class="stage-row"><label>Button alignment</label>'
        + '<select class="btn-align-input" data-stage-idx="'+sIdx+'">'
        + BUTTON_ALIGN_OPTIONS.map(function(a){
            return '<option value="'+a+'"'+(a===btnAlign?' selected':'')+'>'+a.charAt(0).toUpperCase()+a.slice(1)+'</option>';
          }).join("")
        + '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function renderField(formKey, stage, field, sIdx, fIdx){
    var isStandard = !!field.standard;
    var html = '<div class="field-row" data-field-idx="'+fIdx+'">';
    html += '<div class="field-row-top">';

    html += '<div class="grow"><label class="mini">Label</label>'
      + '<input type="text" class="f-label" value="'+esc(field.label)+'" title="'+esc(field.label)+'"></div>';

    html += '<div><label class="mini">Type</label>'
      + '<select class="f-type"'+(isStandard?' disabled':'')+'>'
      + TYPE_OPTIONS.map(function(t){ return '<option value="'+t+'"'+(t===field.type?' selected':'')+'>'+t+'</option>'; }).join("")
      + '</select></div>';

    html += '<div class="req-toggle"><label><input type="checkbox" class="f-required"'+(field.required?' checked':'')+'> Required</label></div>';

    html += '<div class="field-btns">'
      + '<button type="button" class="icon-btn f-up" title="Move up">↑</button>'
      + '<button type="button" class="icon-btn f-down" title="Move down">↓</button>'
      + '<button type="button" class="icon-btn danger f-delete" title="Delete field"'+(field.locked?' disabled':'')+'>✕</button>'
      + '</div>';

    html += '</div>'; // field-row-top

    html += '<div style="margin-top:8px;"><label class="mini">Subtitle (optional, shown under the question)</label>'
      + '<input type="text" class="f-note" placeholder="e.g. While we will do our best to accommodate..." value="'+esc(field.note||"")+'"></div>';

    if(field.locked){
      html += '<span class="locked-note">used to match this contact — don\'t delete</span>';
    }

    if(!isStandard){
      var mapText = field.ghlName
        ? 'saves to GHL: ' + field.ghlName + ' (' + (field.ghlKey||'pending') + ')'
        : '(will create a new GHL field named "' + field.label + '" on save)';
      html += '<div class="ghl-map'+(field.ghlName?'':' will-create')+'">→ ' + esc(mapText) + '</div>';
    } else {
      html += '<div class="ghl-map">→ native GHL contact field (' + esc(field.standardKey||"") + ')</div>';
    }

    if((field.type === "radio" || field.type === "checkbox-group") && field.type !== "select"){
      html += renderOptionsEditor(field);
    }

    if(stage.exit && stage.exit.field === field.id){
      html += '<div class="exit-note">'
        + '<div>If <strong>'+esc(stage.exit.equals)+'</strong> is selected: also tags '
        + '<input type="text" class="exit-tag-input" data-stage-idx="'+sIdx+'" value="'+esc(tagsToText(stage.exit.tag))+'"> '
        + '(in addition to the stage tag above) and stops.</div>'
        + '<label class="mini">Message shown to them</label>'
        + '<textarea class="exit-msg-input" data-stage-idx="'+sIdx+'" rows="2">'+esc(stage.exit.message)+'</textarea>'
        + '</div>';
    }

    html += '</div>'; // field-row
    return html;
  }

  function renderOptionsEditor(field){
    var html = '<div class="options-editor">';
    (field.options||[]).forEach(function(opt, oIdx){
      html += '<div class="opt-row" data-opt-idx="'+oIdx+'">'
        + '<input type="text" class="opt-label" placeholder="Label" value="'+esc(opt.label)+'">'
        + '<input type="text" class="opt-value" placeholder="Value" value="'+esc(opt.value)+'">'
        + '<label class="opt-soldout"><input type="checkbox" class="opt-soldout-cb"'+(opt.soldOut?' checked':'')+'> Sold out</label>'
        + '<button type="button" class="icon-btn opt-delete" title="Remove option">✕</button>'
        + '</div>';
    });
    html += '<button type="button" class="add-option-btn">+ Add option</button>';
    html += '</div>';
    return html;
  }

  /* ---------------- CHOOSE EXISTING GHL FIELD ---------------- */
  function usedGhlKeys(cfg){
    var used = {};
    (cfg.stages||[]).forEach(function(s){
      (s.fields||[]).forEach(function(f){ if(f.ghlKey) used[f.ghlKey] = true; });
    });
    return used;
  }

  function ensureGhlFieldsLoaded(cb){
    if(ghlFieldsCache !== null){ cb(); return; }
    if(ghlFieldsLoading){ return; }
    ghlFieldsLoading = true;
    fetch(WORKER_BASE + "/admin/ghl-fields", {headers: authHeaders()})
      .then(function(r){ return r.json().then(function(body){ return {ok:r.ok, body:body}; }); })
      .then(function(res){
        ghlFieldsLoading = false;
        if(!res.ok){
          ghlFieldsCache = [];
          ghlFieldsLoadError = (res.body && res.body.error) || "Couldn't load GHL fields.";
        } else {
          ghlFieldsCache = res.body;
          ghlFieldsLoadError = null;
        }
        cb();
      })
      .catch(function(){
        ghlFieldsLoading = false;
        ghlFieldsCache = [];
        ghlFieldsLoadError = "Couldn't reach the server.";
        cb();
      });
  }

  function renderExistingFieldPicker(cfg, pickerKey){
    var html = '<div class="add-form-box">';
    if(ghlFieldsCache === null){
      html += '<p class="add-form-hint">Loading GHL fields…</p>';
    } else if(ghlFieldsLoadError){
      html += '<p class="panel-error">'+esc(ghlFieldsLoadError)+'</p>';
    } else {
      var used = usedGhlKeys(cfg);
      var available = ghlFieldsCache.filter(function(f){ return !used[f.fieldKey]; });
      if(!available.length){
        html += '<p class="add-form-hint">No other GHL fields available to attach — every existing text field is already used somewhere on this form.</p>';
      } else {
        html += '<div class="stage-row"><label>Existing GHL field</label>'
          + '<select data-existing-field-select="'+esc(pickerKey)+'">'
          + available.map(function(f){
              return '<option value="'+esc(f.fieldKey)+'">'+esc(f.name)+' ('+esc(f.dataType)+')</option>';
            }).join("")
          + '</select></div>'
          + '<p class="add-form-hint">Adds this question using the field GHL already has — nothing new gets created, and whatever&rsquo;s already stored under it stays put.</p>'
          + '<div class="save-row"><button type="button" class="save-btn" data-existing-field-add="'+esc(pickerKey)+'">Add field</button></div>';
      }
    }
    html += '</div>';
    return html;
  }

  /* ---------------- EVENTS ---------------- */
  function wirePanelEvents(formKey, cfg){
    // Embed-code copy button
    var copyBtn = panelEl.querySelector(".copy-embed-btn");
    if(copyBtn){
      copyBtn.addEventListener("click", function(){
        var code = copyBtn.getAttribute("data-embed");
        var msgEl = document.getElementById("copy-msg-"+formKey);
        function showCopied(){ if(msgEl){ msgEl.textContent = "Copied!"; setTimeout(function(){ if(msgEl) msgEl.textContent = ""; }, 2000); } }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(code).then(showCopied, function(){ fallbackCopy(code, showCopied); });
        } else {
          fallbackCopy(code, showCopied);
        }
      });
    }
    // Confirmation message edits
    var successEmojiInp = document.getElementById("success-emoji-input");
    if(successEmojiInp){
      successEmojiInp.addEventListener("input", function(){
        cfg.success = cfg.success || {};
        cfg.success.emoji = successEmojiInp.value;
      });
    }
    var successHeadingInp = document.getElementById("success-heading-input");
    if(successHeadingInp){
      successHeadingInp.addEventListener("input", function(){
        cfg.success = cfg.success || {};
        cfg.success.heading = successHeadingInp.value;
      });
    }
    var successMessageInp = document.getElementById("success-message-input");
    if(successMessageInp){
      successMessageInp.addEventListener("input", function(){
        cfg.success = cfg.success || {};
        cfg.success.message = successMessageInp.value;
      });
    }
    // Stage tag edits
    Array.prototype.forEach.call(panelEl.querySelectorAll(".tag-input"), function(inp){
      inp.addEventListener("input", function(){
        var sIdx = +inp.getAttribute("data-stage-idx");
        cfg.stages[sIdx].tag = textToTags(inp.value);
      });
    });
    // Eligibility-gate exit tag/message edits
    Array.prototype.forEach.call(panelEl.querySelectorAll(".exit-tag-input"), function(inp){
      inp.addEventListener("input", function(){
        var sIdx = +inp.getAttribute("data-stage-idx");
        cfg.stages[sIdx].exit.tag = textToTags(inp.value);
      });
    });
    Array.prototype.forEach.call(panelEl.querySelectorAll(".exit-msg-input"), function(inp){
      inp.addEventListener("input", function(){
        var sIdx = +inp.getAttribute("data-stage-idx");
        cfg.stages[sIdx].exit.message = inp.value;
      });
    });
    // Button text/alignment edits
    Array.prototype.forEach.call(panelEl.querySelectorAll(".btn-text-input"), function(inp){
      inp.addEventListener("input", function(){
        var sIdx = +inp.getAttribute("data-stage-idx");
        cfg.stages[sIdx].buttonText = inp.value;
      });
    });
    Array.prototype.forEach.call(panelEl.querySelectorAll(".btn-align-input"), function(sel){
      sel.addEventListener("change", function(){
        var sIdx = +sel.getAttribute("data-stage-idx");
        cfg.stages[sIdx].buttonAlign = sel.value;
      });
    });

    Array.prototype.forEach.call(panelEl.querySelectorAll(".stage-card"), function(stageEl){
      var sIdx = +stageEl.getAttribute("data-stage-idx");
      var stage = cfg.stages[sIdx];

      Array.prototype.forEach.call(stageEl.querySelectorAll(".field-row"), function(rowEl){
        var fIdx = +rowEl.getAttribute("data-field-idx");
        var field = stage.fields[fIdx];

        rowEl.querySelector(".f-label").addEventListener("input", function(e){
          field.label = e.target.value;
          e.target.title = e.target.value;
          // Live-update the "will create" preview text without a full re-render.
          if(!field.ghlName){
            var mapEl = rowEl.querySelector(".ghl-map");
            if(mapEl) mapEl.textContent = '→ (will create a new GHL field named "' + field.label + '" on save)';
          }
        });
        var typeSel = rowEl.querySelector(".f-type");
        if(!typeSel.disabled){
          typeSel.addEventListener("change", function(e){
            field.type = e.target.value;
            renderPanel();
          });
        }
        rowEl.querySelector(".f-required").addEventListener("change", function(e){
          field.required = e.target.checked;
        });
        rowEl.querySelector(".f-note").addEventListener("input", function(e){
          field.note = e.target.value;
        });
        rowEl.querySelector(".f-up").addEventListener("click", function(){
          if(fIdx > 0){
            stage.fields.splice(fIdx-1, 0, stage.fields.splice(fIdx,1)[0]);
            renderPanel();
          }
        });
        rowEl.querySelector(".f-down").addEventListener("click", function(){
          if(fIdx < stage.fields.length-1){
            stage.fields.splice(fIdx+1, 0, stage.fields.splice(fIdx,1)[0]);
            renderPanel();
          }
        });
        var delBtn = rowEl.querySelector(".f-delete");
        if(!delBtn.disabled){
          delBtn.addEventListener("click", function(){
            if(!confirm('Delete the field "'+field.label+'"? This does not delete anything already saved in GHL, it just removes it from this form.')) return;
            stage.fields.splice(fIdx, 1);
            renderPanel();
          });
        }

        // Options editor
        var optEditor = rowEl.querySelector(".options-editor");
        if(optEditor){
          Array.prototype.forEach.call(optEditor.querySelectorAll(".opt-row"), function(optRow){
            var oIdx = +optRow.getAttribute("data-opt-idx");
            var opt = field.options[oIdx];
            optRow.querySelector(".opt-label").addEventListener("input", function(e){ opt.label = e.target.value; });
            optRow.querySelector(".opt-value").addEventListener("input", function(e){ opt.value = e.target.value; });
            optRow.querySelector(".opt-soldout-cb").addEventListener("change", function(e){ opt.soldOut = e.target.checked; });
            optRow.querySelector(".opt-delete").addEventListener("click", function(){
              field.options.splice(oIdx, 1);
              renderPanel();
            });
          });
          optEditor.querySelector(".add-option-btn").addEventListener("click", function(){
            field.options = field.options || [];
            field.options.push({label:"New Option", value:"New Option"});
            renderPanel();
          });
        }
      });

      var addFieldBtn = stageEl.querySelector("[data-add-field-stage]");
      addFieldBtn.addEventListener("click", function(){
        stage.fields.push({
          id: "custom_" + Date.now().toString(36),
          label: "New Field",
          type: "textarea",
          required: false,
          standard: false
        });
        renderPanel();
      });

      var pickerKey = formKey + ":" + sIdx;
      var existingFieldBtn = stageEl.querySelector("[data-existing-field-stage]");
      existingFieldBtn.addEventListener("click", function(){
        var cur = existingFieldPicker[pickerKey];
        if(cur && cur.open){
          delete existingFieldPicker[pickerKey];
          renderPanel();
          return;
        }
        existingFieldPicker[pickerKey] = {open: true};
        ensureGhlFieldsLoaded(renderPanel);
        renderPanel();
      });
      var existingFieldAddBtn = stageEl.querySelector('[data-existing-field-add="'+pickerKey+'"]');
      if(existingFieldAddBtn){
        existingFieldAddBtn.addEventListener("click", function(){
          var sel = stageEl.querySelector('[data-existing-field-select="'+pickerKey+'"]');
          var fieldKey = sel && sel.value;
          var chosen = (ghlFieldsCache||[]).filter(function(f){ return f.fieldKey === fieldKey; })[0];
          if(!chosen) return;
          stage.fields.push({
            id: "custom_" + Date.now().toString(36),
            label: chosen.name,
            type: chosen.type,
            required: false,
            standard: false,
            ghlKey: chosen.fieldKey,
            ghlFieldId: chosen.id,
            ghlName: chosen.name,
            dataType: chosen.dataType
          });
          delete existingFieldPicker[pickerKey];
          renderPanel();
        });
      }
    });

    // Save button
    var saveBtn = document.getElementById("save-btn-" + formKey);
    saveBtn.addEventListener("click", function(){
      saveBtn.disabled = true; saveBtn.textContent = "Saving...";
      var msgEl = document.getElementById("save-msg-" + formKey);
      msgEl.textContent = ""; msgEl.className = "save-msg";
      fetch(WORKER_BASE + "/admin/config", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({form: formKey, config: cfg})
      })
      .then(function(r){ return r.json().then(function(body){ return {ok:r.ok, status:r.status, body:body}; }); })
      .then(function(res){
        saveBtn.disabled = false; saveBtn.textContent = "Save Changes";
        if(!res.ok){
          var detail = (res.body && (res.body.detail || res.body.error)) || ("HTTP " + res.status);
          state.saveMsg[formKey] = {ok:false, text: "Save failed: " + detail};
          renderPanel();
          return;
        }
        state.configs[formKey] = res.body; // reflects real ghlKey/ghlFieldId for any new fields
        state.saveMsg[formKey] = {ok:true, text: "Saved."};
        renderPanel();
      })
      .catch(function(err){
        saveBtn.disabled = false; saveBtn.textContent = "Save Changes";
        state.saveMsg[formKey] = {ok:false, text: "Save failed: " + err.message};
        renderPanel();
      });
    });
  }
})();
</script>
</body>
</html>
