<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule a Call — Kerry Kott</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'sunflora-hksqi6';
  font-style: normal; font-weight: 400; font-display: swap;
  src: url('https://file.squarespace-cdn.com/content/v2/namespaces/fonts/libraries/5fad387af44df56affb45c67/assets/37ab1441-81a8-45bc-8fea-80033769339c/font.woff2') format('woff2');
}
/* ===== Scoped to #ef-cal only — never styles the host page body =====
   Shared template for every calendar page created via the admin's
   Calendars tab. Which calendar it renders is decided at runtime by
   ?cal=<slug> (set by the _redirects rewrite of /<slug> on
   schedule.kerrykott.com) — a new calendar never needs a new file or a
   deploy. */
#ef-cal{
  --cream:#F5F0EB;
  --ink:#2A221E;
  --border:#C7BCAD;
  --muted:#8C8073;
  --panel:#FBF9F6;
  --font-display:"sunflora-hksqi6","Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:"Sorts Mill Goudy",Georgia,"Times New Roman",serif;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100vh;
}
#ef-cal *{box-sizing:border-box;}
#ef-cal [hidden]{display:none !important;}
#ef-cal .ef-cal-shell{max-width:900px;margin:0 auto;padding:44px 24px 64px;}
#ef-cal .ef-cal-logo{display:block;width:220px;max-width:70%;height:auto;margin:0 auto 36px;}

#ef-cal .ef-cal-status{text-align:center;color:var(--muted);font-size:17px;padding:60px 10px;}

#ef-cal .ef-cal-card{
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:20px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
  overflow:hidden;
}
#ef-cal .ef-cal-info{padding:44px 40px;}
#ef-cal .ef-cal-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(24px,3vw,30px);
  line-height:1.2;
  margin:0 0 8px;
}
#ef-cal .ef-cal-meta{font-size:15px;color:var(--muted);margin:0 0 22px;}
#ef-cal .ef-cal-desc{font-size:16px;line-height:1.65;margin:0;white-space:pre-wrap;}

#ef-cal .ef-cal-widget{border-left:1.5px solid var(--border);background:#fff;padding:18px;display:flex;}
#ef-cal .ef-cal-widget iframe{width:100%;border:none;min-height:560px;display:block;}

@media (max-width:760px){
  #ef-cal .ef-cal-card{grid-template-columns:1fr;border-radius:16px;}
  #ef-cal .ef-cal-info{padding:30px 26px;}
  #ef-cal .ef-cal-widget{border-left:none;border-top:1.5px solid var(--border);padding:14px;}
}
</style>
</head>
<body>

<div id="ef-cal">
  <div class="ef-cal-shell">
    <img class="ef-cal-logo" src="https://assets.cdn.filesafe.space/ps7itsG5PeLgg7TDwnGV/media/6a47eac4989afcfcc93100ed.png" alt="Kerry Kott">

    <p class="ef-cal-status" id="ef-cal-status">Loading...</p>

    <div class="ef-cal-card" id="ef-cal-card" hidden>
      <div class="ef-cal-info">
        <h1 class="ef-cal-name" id="ef-cal-name"></h1>
        <p class="ef-cal-meta" id="ef-cal-meta"></p>
        <p class="ef-cal-desc" id="ef-cal-desc"></p>
      </div>
      <div class="ef-cal-widget">
        <iframe id="ef-cal-iframe" scrolling="auto" title="Book a time"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var WORKER_BASE = "https://kerry-forms.miriam-68c.workers.dev";
  var SLUG = (new URLSearchParams(window.location.search)).get("cal") || "";
  var statusEl = document.getElementById("ef-cal-status");
  var cardEl   = document.getElementById("ef-cal-card");

  if(!SLUG){
    statusEl.textContent = "No calendar specified.";
    return;
  }

  fetch(WORKER_BASE + "/calendar?slug=" + encodeURIComponent(SLUG))
    .then(function(r){
      if(r.status === 404) throw new Error("__notfound__");
      if(!r.ok) throw new Error("fetch failed");
      return r.json();
    })
    .then(function(cal){
      document.title = cal.name ? cal.name + " — Kerry Kott" : "Schedule a Call — Kerry Kott";
      document.getElementById("ef-cal-name").textContent = cal.name || "";
      var meta = [cal.duration, cal.platform].filter(Boolean).join(" | ");
      document.getElementById("ef-cal-meta").textContent = meta;
      document.getElementById("ef-cal-desc").textContent = cal.description || "";

      var iframe = document.getElementById("ef-cal-iframe");
      iframe.src = cal.embedUrl;

      // The GHL booking widget posts its real content height on every
      // resize (including the date-picker -> booking-form jump) as
      // ["highlevel.setHeight", {height, id}]. Nothing applies it unless
      // we listen — and GHL's own form_embed.js is the WRONG fix here: it
      // hides the iframe until an "iframeLoaded" message the booking
      // widget never sends. See reference_ghl_calendar_iframe_resize.
      window.addEventListener("message", function(e){
        if(e.source !== iframe.contentWindow) return;
        var data = e.data;
        try{ if(typeof data === "string") data = JSON.parse(data); }catch(err){ return; }
        if(!Array.isArray(data) || data[0] !== "highlevel.setHeight") return;
        var h = data[1] && data[1].height;
        if(typeof h === "number" && h > 0){
          iframe.style.height = h + "px";
          iframe.style.minHeight = h + "px";
        }
      });

      statusEl.hidden = true;
      cardEl.hidden = false;
    })
    .catch(function(err){
      statusEl.textContent = (err.message === "__notfound__")
        ? "This calendar doesn't exist."
        : "This page couldn't load. Please refresh, or contact us if it keeps happening.";
    });
})();
</script>
</body>
</html>
